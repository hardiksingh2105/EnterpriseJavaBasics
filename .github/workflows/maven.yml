name: Maven verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pom:
          - Lab-2-Student-Management/pom.xml
          - Lab-3-Student-CRUD/pom.xml
          - student-management/pom.xml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress -f "${{ matrix.pom }}" verify
